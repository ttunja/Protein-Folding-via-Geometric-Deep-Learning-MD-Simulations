_target_: src.TINGnn
name: no_temporal
# data
seq_len: 30
dilation: 1
num_particle_types: 5
num_bond_types: 0
radius: 6
deterministic: False
# No recurrent temporal encoder. The 30-frame velocity and edge sequences
# are flattened and projected with a single Linear layer, so the network
# still sees the same window but cannot encode order-aware history.
use_gru: False
use_temporal: False
# networks
type_emb_size: 32
gn_hparams: {'latent_size': 128, 'hidden_size': 128, 'num_hidden_layers': 2, 'num_message_passing_steps': 7, 'equivariant': False}
embedding_gn_hparams: {'latent_size': 64, 'hidden_size': 64, 'num_hidden_layers': 2, 'num_message_passing_steps': 7, 'output_size': 128}
property_net_hparams: {'hidden_size': 256, 'num_hidden_layers': 2, 'output_size': 1}
# noise params
noise_std: 0.1
