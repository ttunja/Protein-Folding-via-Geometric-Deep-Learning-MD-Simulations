_target_: src.TINGnn
name: TINGnn
# data
seq_len: 30
dilation: 1
num_particle_types: 5
num_bond_types: 0
radius: 6
deterministic: False
use_gru: True
# networks
type_emb_size: 32
gn_hparams: {'latent_size': 128, 'hidden_size': 128, 'num_hidden_layers': 2, 'num_message_passing_steps': 7, 'equivariant': True}
# gn_hparams: {'latent_size': 32, 'hidden_size': 32, 'num_hidden_layers': 2, 'num_message_passing_steps': 3}
embedding_gn_hparams: {'latent_size': 64, 'hidden_size': 64, 'num_hidden_layers': 2, 'num_message_passing_steps': 7, 'output_size': 128}
# embedding_gn_hparams: {'latent_size': 16, 'hidden_size': 16, 'num_hidden_layers': 2, 'num_message_passing_steps': 3}
property_net_hparams: {'hidden_size': 256, 'num_hidden_layers': 2, 'output_size': 1}
# noise params
noise_std: 0.1
# multi-step rollout training (K=1 is single-step, K>1 unrolls K steps)
rollout_steps: 1
# velocity clamping at inference (null = disabled)
max_vel: null