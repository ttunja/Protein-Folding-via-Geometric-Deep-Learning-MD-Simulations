random_seed: 1
rollout_length: 530
batch_size: 16
num_batches: 1
deter: False
shuffle: False
save_pos: True
save_frequency: 1
grouping: 10
device: cuda
model_dir: ${oc.env:MODEL_DIR}
folded_protein: /home/ubuntu/data/PROTEIN-FOLDING-DATA/Chignolin/folded/2rvd.pdb
save_dir: ${model_dir}

ld_kwargs:
  step_per_sigma: 5
  step_size: 0.0001

data:
  _target_: preprocessing.data.ProteinDataset
  directory: /home/ubuntu/data/PROTEIN-FOLDING-DATA/Chignolin/protein_train
  split: ${oc.env:PROJECT_ROOT}/data/test_chignolin.txt
  mode: rollout
  recursive_metis: False

hydra:
  run:
    dir: ${save_dir}
