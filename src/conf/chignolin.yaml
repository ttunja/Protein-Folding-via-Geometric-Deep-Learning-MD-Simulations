
expname: ${data.name}_${model.name}
protein: Chignolin
workdir: ${oc.env:MODEL_DIR}/${protein}/${expname}
# subdirname: ${oc.env:MODEL_DIR}
core:
  version: 0.0.1
  tags:
    - mytag

hydra:
  run:
    dir: ${workdir}

  sweep:
    dir: ${workdir}
    subdir: ${hydra.job.num}_${hydra.job.id}

  job:
    env_set:
      WANDB_START_METHOD: thread
      WANDB_DIR: ./

defaults:
  - data: chignolin
  - model: chignolin
  - logging: default
  - optim: chignolin
  - train: chignolin
