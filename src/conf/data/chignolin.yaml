name: chignolin
dir: ${oc.env:PROTEIN_DATASET_DIR}
batch_size: 10
traj_len: 10000
shuffle: True


datamodule:
  # _target_: src.data.datamodule.PLDataModule

  datasets:

    train:
      _target_: src.data.ProteinDataset
      split: ${oc.env:PROJECT_ROOT}/data/train.txt
      directory: ${data.dir}
      dilation: ${model.dilation}
      seq_len: ${model.seq_len}
      traj_len: ${data.traj_len}

    val:
      - _target_: src.data.ProteinDataset
        split: ${oc.env:PROJECT_ROOT}/data/val.txt 
        directory: ${data.dir}
        dilation: ${model.dilation}
        seq_len: ${model.seq_len}
        traj_len: ${data.traj_len}
  
    test:
      - _target_: src.data.ProteinDataset
        split: ${oc.env:PROJECT_ROOT}/data/test.txt 
        directory: ${data.dir}
        dilation: ${model.dilation}
        seq_len: ${model.seq_len}
        traj_len: ${data.traj_len}
  
  num_workers:
    train: 8
    val: 4
    test: 4

  batch_size:
    train: ${data.batch_size}
    val: ${data.batch_size}
    test: ${data.batch_size}